services:
  postgres:
    image: postgres:16
    container_name: jarvis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis_dev_password
      POSTGRES_DB: jarvis
    ports:
      - "5433:5432"
    volumes:
      - jarvis_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: jarvis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  jarvis_pg_data:
